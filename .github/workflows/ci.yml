name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: bogdanp/setup-racket@v1.16
        with:
          version: "stable"
      - name: Install dependencies
        run: timeout 600s raco pkg install --auto --batch
      - name: Run tests
        run: timeout 600s raco test --timeout 120 -p ambKanren
